<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REPLY LAB · 客服回复质量评估</title>
<style>
:root{--ink:#173534;--muted:#637675;--teal:#147b72;--mint:#e7f3ed;--paper:#f4f5f0;--line:#dce4dc;--amber:#a16323;--red:#b94d3a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}a{color:var(--teal)}button,a,input,select,summary{outline-offset:4px}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:0 40px}header{border-bottom:1px solid var(--line);background:#fafbf7}.top{display:flex;align-items:center;justify-content:space-between;min-height:80px;gap:20px}.brand{font-size:18px;letter-spacing:2px;font-weight:800}.mark{display:inline-grid;place-items:center;background:var(--ink);color:#fff;width:34px;height:34px;margin-right:12px;border-radius:8px;letter-spacing:0}.top small{color:var(--muted);font-size:12px;letter-spacing:1px}.top-links{display:flex;gap:24px;font-size:12px}.top-links a{text-decoration:none}.hero{padding:38px 0 25px;display:flex;justify-content:space-between;gap:24px;align-items:end}.eyebrow{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}h1{font-size:34px;line-height:1.25;letter-spacing:-1px;margin:12px 0}h2{font-size:19px;margin:0}h3{font-size:15px;margin:0 0 12px}p{margin:8px 0}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:20px;background:var(--mint);color:#246c54;font-size:11px;padding:4px 10px;white-space:nowrap}.pill.warn{background:#f8ecdc;color:#925e25}.pill.bad{background:#fae8e0;color:#a7412f}.notice{border:1px solid #dfd4b8;background:#fcf7e9;border-radius:10px;padding:13px 18px;color:#705b2c;font-size:12px;margin-bottom:22px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric{border:1px solid var(--line);border-radius:14px;background:#fff;padding:22px 24px;min-height:162px}.metric.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.metric-label{font-size:12px;color:var(--muted)}.primary .metric-label,.primary .sub{color:#b9d2c9}.value{font-size:44px;font-weight:600;line-height:1.3;letter-spacing:-2px;margin:9px 0 4px}.value small{font-size:16px;letter-spacing:0;margin-left:5px;font-weight:400}.sub{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin:22px 0}.panel{border:1px solid var(--line);background:#fff;border-radius:14px;padding:25px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.section-head small{font-size:11px;color:var(--muted)}.dimension{display:grid;grid-template-columns:138px 1fr 65px;gap:15px;align-items:center;margin:17px 0}.bar{height:8px;background:#edf1eb;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:10px}.dim-val{text-align:right;font-size:16px;font-weight:600}.dist{font-size:10px;color:var(--muted);display:flex;gap:15px;flex-wrap:wrap;margin-top:20px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:5px}.risk-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef1eb}.risk-row strong{font-size:16px}.risk-bottom{margin-top:16px;padding:13px;background:#f6f7f2;border-radius:8px;font-size:12px}.worst-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.worst{padding:19px;border:1px solid #e3e5da;background:#fafbf7;border-radius:10px;cursor:pointer;text-align:left;color:var(--ink)}.worst:hover{border-color:var(--teal)}.worst-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}.worst strong{font-size:25px;color:var(--red)}.worst h3{margin:8px 0;font-size:14px}.worst p{font-size:11px;color:var(--muted);line-height:1.8}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin:30px 0 18px}.tab{border:0;background:none;color:var(--muted);padding:10px 2px 14px;border-bottom:3px solid transparent}.tab.active{color:var(--teal);border-color:var(--teal);font-weight:700}.toolbar{display:flex;gap:12px;margin-bottom:16px;align-items:center}input,select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 12px;color:var(--ink)}input{flex:1;min-width:100px}.case{border:1px solid var(--line);background:#fff;border-radius:10px;margin-bottom:10px;overflow:hidden}.case summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:80px minmax(150px,1fr) 145px 95px 32px;gap:15px;align-items:center;padding:18px 22px}.case summary::-webkit-details-marker{display:none}.case[open] summary{background:#f8faf5;border-bottom:1px solid var(--line)}.case-id{font:11px Consolas,monospace;color:var(--muted)}.question{font-weight:600}.score{font-size:18px;font-weight:700;text-align:right}.arrow{color:var(--muted);text-align:right}.case[open] .arrow{transform:rotate(90deg)}.case-content{padding:24px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}.quote{background:#f5f7f2;border-left:3px solid #aac5b8;padding:14px 16px;font-size:13px;white-space:pre-wrap}.reference{background:#f7f5ef;border-color:#c9b995}.mini-scores{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.mini{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11px}.finding{padding:13px 0;border-top:1px solid #edf0e9;font-size:12px}.finding code{color:var(--teal)}.finding blockquote{margin:8px 0;color:var(--muted);border-left:2px solid #ccd9cf;padding-left:12px}.finding p{margin:4px 0}.compare{background:#f8f9f5;border-radius:8px;padding:17px;margin-top:20px}.compare h4{margin:12px 0 6px;font-size:12px}.compare ul{margin:0;padding-left:20px;font-size:12px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}.tag{background:#edf3f2;color:#417773;padding:3px 8px;border-radius:4px;font-size:10px}.calibration-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}.table-wrap{overflow:auto}.empty{padding:35px;text-align:center;color:var(--muted)}.method{max-width:920px}.method li{margin:12px 0}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:20px 0}.flow span{background:var(--mint);border-radius:7px;padding:10px 13px;font-size:12px}footer{margin:36px 0 24px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:11px}[hidden]{display:none!important}.mono{font-family:Consolas,monospace;overflow-wrap:anywhere}.quality-good{color:var(--teal)}
@media(max-width:900px){.shell{padding:0 20px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.worst-grid{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.hero{align-items:start}.hero h1{font-size:27px}.top-links{gap:12px}.case summary{grid-template-columns:65px 1fr 105px}.case summary .pill{grid-column:2}.case summary .score{grid-column:3;grid-row:1}.arrow{display:none}.toolbar{flex-wrap:wrap}.toolbar input{width:100%;flex-basis:100%}.calibration-metrics{grid-template-columns:1fr}.hero .hero-badge{display:none}}
@media print{.tabs,.toolbar,.top-links{display:none}.shell{max-width:none;padding:0}body{background:#fff}.panel,.case,.metric{break-inside:avoid}.hero{padding-top:20px}}
</style>
</head>
<body>
<header><div class="shell top"><div class="brand"><span class="mark">R</span>REPLY LAB <small> / 客服质量观察室</small></div><div class="top-links"><a href="report.md">分析报告 ↗</a><a href="scores.csv">导出评分 ↓</a><a href="results.json">原始结果 ↓</a></div></div></header>
<main class="shell">
<section class="hero"><div><div class="eyebrow">CUSTOMER SERVICE · EVALUATION REPORT</div><h1>让每一次回复，都有据可评。</h1><p class="muted">从用户诉求出发，检查回复质量、服务缺口与事实风险。</p></div><div class="hero-badge"><span class="pill" id="mode"></span><p class="sub" id="model"></p></div></section>
<div class="notice" id="notice"></div>
<section class="metrics" id="metrics"></section>
<div class="grid"><section class="panel"><div class="section-head"><h2>四维质量画像</h2><small>均分 / 100 · 不适用项弃权</small></div><div id="dimensions"></div><div class="dist"><span><i class="dot"></i>已评维度</span><span>事实依据缺失时不虚构分数</span><span>维度原始量表：0–4 分</span></div></section><section class="panel"><div class="section-head"><h2>事实与复核信号</h2><small>证据状态独立于质量分</small></div><div id="risks"></div></section></div>
<section class="panel"><div class="section-head"><h2>优先关注 · 最低分 3 条</h2><small>按综合分升序 · 点击查看原文依据</small></div><div class="worst-grid" id="worst"></div></section>
<nav class="tabs" aria-label="报告内容"><button class="tab active" data-tab="cases" aria-selected="true">逐条评估</button><button class="tab" data-tab="calibration" aria-selected="false">人工校准</button><button class="tab" data-tab="method" aria-selected="false">方法与边界</button></nav>
<section id="cases"><div class="toolbar"><input id="search" type="search" aria-label="搜索案例" placeholder="搜索问题、回复或案例编号…"><select id="filter" aria-label="筛选质量状态"><option value="all">全部状态</option><option value="gap">服务缺口</option><option value="risk">高风险待复核</option><option value="unverified">有待核实断言</option></select><select id="sort" aria-label="排序方式"><option value="id">按案例编号</option><option value="score">按评分从低到高</option></select><span class="sub" id="count"></span></div><div id="case-list"></div></section>
<section id="calibration" class="panel" hidden></section><section id="method" class="panel" hidden></section>
<footer><span>REPLY LAB / 可解释的客服回复质量评估</span><span id="footer-meta"></span></footer>
</main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent),S=D.summary,M=D.metadata;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=n=>n==null?'N/A':(n*100).toFixed(1)+'%',num=n=>n==null?'N/A':n;
const N={relevance:'切题与一致性',usefulness:'问题解决有效性',tone:'语气与情境关怀',grounding:'事实依据'};
const T={passive_service:'服务推进不足',generic_answer:'回答过于通用',missing_clarification:'缺少必要追问',insufficient_empathy:'情境关怀不足',intent_mismatch:'诉求错配'};
const modeName=M.mode==='llm'?'真实 LLM · 规则融合':M.mode==='mock'?'离线 MOCK · 混合流程演示':'离线规则基线';
$('mode').textContent=modeName;$('model').textContent=M.model||'动态规则模拟 · 未调用语义模型';
$('notice').textContent=(M.mode==='mock'?'当前为离线演示，分数来自规则模拟，不代表真实 LLM 效果。 ':'')+'证据边界：'+S.provisional_count+' 条分数尚未覆盖完整事实核验。待核实 ≠ 已证实错误；当前结果不能直接作为扩大上线范围的依据。';
$('metrics').innerHTML=[['整体暂定质量分',S.mean_score,'/100','仅汇总已评维度 · 事实缺失时重新归一化'],['评估样本',S.count,'条','逐条评分、证据与建议均可追溯'],['服务解决缺口',S.service_gap_count,'条','有效性 ≤ '+M.config.service_gap_max_score+' / 4 · 优先改进处理路径'],['待核实断言',S.claim_statuses.unverified,'个','句段级抽取 · 需要业务知识或工具证据']].map((m,i)=>`<article class="metric ${i===0?'primary':''}"><div class="metric-label">${m[0]}</div><div class="value">${m[1]}<small>${m[2]}</small></div><div class="sub">${m[3]}</div></article>`).join('');
$('dimensions').innerHTML=Object.entries(S.dimensions).map(([k,d])=>`<div class="dimension"><span>${esc(d.name)}</span><div class="bar"><i style="width:${d.mean??0}%"></i></div><span class="dim-val">${num(d.mean)}</span></div>`).join('');
const high=D.results.filter(r=>r.quality_status==='高风险待复核').length;
$('risks').innerHTML=[['已获得业务证据',S.verified_claim_count+' / '+S.claim_count],['抽取断言证据覆盖率',pct(S.claim_coverage)],['高风险待复核',high+' 条'],['已证实矛盾断言',S.claim_statuses.contradicted+' 个']].map(x=>`<div class="risk-row"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')+`<div class="risk-bottom">${S.capped_count} 条触发硬性门控。未经证实的具体承诺单独进入复核，避免被礼貌或流畅表达掩盖。</div>`;
$('worst').innerHTML=S.worst_ids.map(id=>{const r=D.results.find(x=>x.id===id),reason=r.semantic?.issues?.[0]?.reason||r.findings[0]?.reason||'请结合逐条证据复核。';return `<button class="worst" data-case="${esc(id)}"><div class="worst-top"><span>${esc(id)} / ${esc(r.intent)}</span><strong>${r.total_score}</strong></div><h3>${esc(r.user_question)}</h3><p>${esc(reason)}</p><span class="pill ${r.quality_status==='高风险待复核'?'bad':'warn'}">${esc(r.quality_status)}</span></button>`}).join('');
function list(arr){return '<ul>'+arr.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>'}
function renderCase(r){
 const chips=Object.entries(r.scores).map(([k,v])=>`<span class="mini">${N[k]} <b>${v==null?'N/A':v+' / 4'}</b></span>`).join('');
 const ruleFindings=r.findings.map(f=>`<div class="finding"><code>${esc(f.rule)}</code> <b>${N[f.dimension]} · 规则线索</b><p>${esc(f.reason)}</p><blockquote>${f.origin==='question'?'用户问题':'自动回复'}：${esc(f.quote)}</blockquote></div>`).join('');
 const sem=(r.semantic?.issues||[]).map(i=>`<div class="finding"><b>${esc(T[i.tag])} · ${r.semantic_mode==='llm'?'LLM 判断':'规则模拟'}${i.severity?' · '+(i.severity==='minor'?'轻微':'明显缺口'):''}</b><p>${esc(i.reason)}</p><blockquote>${i.origin==='question'?'用户问题':'自动回复'}：${esc(i.quote)}</blockquote></div>`).join('');
 const claims=r.claims.map(c=>`<div class="finding"><span class="pill ${c.status==='contradicted'?'bad':c.status==='unverified'?'warn':''}">${{supported:'已支持',contradicted:'证据矛盾',unverified:'待核实'}[c.status]}</span><p>${esc(c.quote)}</p><p class="muted">${esc(c.rationale)}${c.source?' · 来源：'+esc(c.source):''}</p></div>`).join('');
 const ref=r.reference?`<div><h3>人工参考 · 仅用于评分后分析</h3><div class="quote reference">${esc(r.reference.human_reference)}</div><p class="sub">标注分析：${esc(r.reference.annotator_notes)}</p></div>`:'';
 const comp=r.comparison?`<div class="compare"><h3>独立参考差异分析 <span class="pill">${r.comparison.mode==='llm_pairwise'?'LLM 成对分析':'离线差异摘要'}</span></h3>${Object.entries({auto_covered:'自动回复已覆盖',reference_added:'参考新增内容',key_gaps:'关键差距',improvements:'改进方向',reference_caveats:'参考自身的局限'}).map(([k,n])=>'<h4>'+n+'</h4>'+list(r.comparison[k])).join('')}</div>`:'';
 return `<details class="case" data-id="${esc(r.id)}"><summary><span class="case-id">${esc(r.id)}</span><span class="question">${esc(r.user_question)}</span><span class="pill ${r.quality_status==='高风险待复核'?'bad':r.quality_status==='需要改进'?'warn':''}">${esc(r.quality_status)}</span><span class="score">${r.total_score}<small class="sub"> /100</small></span><span class="arrow">›</span></summary><div class="case-content"><div class="two-col"><div><h3>自动回复</h3><div class="quote">${esc(r.auto_reply)}</div></div>${ref}</div><div class="mini-scores">${chips}</div>${r.semantic?.assessment?`<div class="compare"><b>服务任务</b><p>${esc(r.semantic.assessment.task)}</p><p class="sub">下一步：${esc({ready:"可继续操作",minor_gap:"轻微缺口",blocked:"处理受阻"}[r.semantic.assessment.next_step])} · 情境证据：${esc(r.semantic.assessment.emotion_trigger||"无明确触发")}</p><p class="sub">${esc(r.semantic.assessment.uncertainty)}</p></div>`:""}${r.review_flags?.length?`<div class="notice" style="margin-top:14px"><b>评分一致性待复核</b>${list(r.review_flags)}</div>`:""}<div class="tags">${r.issue_tags.map(t=>'<span class="tag">'+esc(T[t])+'</span>').join('')}</div><div class="two-col"><div><h3>语义与规则证据</h3>${sem||'<p class="muted">未识别到所定义的问题标签；不代表已确认无缺陷。</p>'}${ruleFindings}<h3>各维度判断理由</h3>${Object.entries(r.semantic.rationales).map(([k,v])=>`<p class="sub"><b>${N[k]}</b>：${esc(v)}</p>`).join('')}${r.fusion_actions.length?'<h3>融合约束</h3>'+list(r.fusion_actions):''}</div><div><h3>事实核验</h3>${claims||'<p class="muted">未检出候选断言；事实依据维度不评分。</p>'}<h3 style="margin-top:18px">改进建议</h3>${list(r.suggestions)}</div></div>${comp}</div></details>`;
}
function renderCases(){const q=$('search').value.toLowerCase(),f=$('filter').value;let rows=D.results.filter(r=>(r.id+r.user_question+r.auto_reply).toLowerCase().includes(q)&&(f==='all'||f==='gap'&&r.service_gap||f==='risk'&&r.quality_status==='高风险待复核'||f==='unverified'&&r.claims.some(c=>c.status==='unverified')));if($('sort').value==='score')rows.sort((a,b)=>a.total_score-b.total_score||a.id.localeCompare(b.id));$('count').textContent=rows.length+' / '+S.count+' 条';$('case-list').innerHTML=rows.length?rows.map(renderCase).join(''):'<div class="empty">没有符合条件的案例。</div>';}
function showTab(name){document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.tab===name;b.classList.toggle('active',on);b.setAttribute('aria-selected',on)});['cases','calibration','method'].forEach(id=>$(id).hidden=id!==name)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
['search','filter','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderCases));
document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{showTab('cases');$('search').value='';$('filter').value='all';renderCases();const card=[...document.querySelectorAll('.case')].find(c=>c.dataset.id===b.dataset.case);card.open=true;card.scrollIntoView({behavior:'smooth',block:'start'})}));
const V=D.issue_validation;
$('calibration').innerHTML=V?`<div class="section-head"><h2>问题标签一致性</h2><span class="pill warn">回顾性校准 · 非盲测</span></div><p class="muted">${esc(V.scope)} 参考差异分析不参与这里的预测。</p><div class="calibration-metrics">${[['Micro Precision',pct(V.micro.precision)],['Micro Recall',pct(V.micro.recall)],['Micro F1',num(V.micro.f1)]].map(x=>'<div class="metric"><div class="metric-label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('')}</div><div class="table-wrap"><table><thead><tr><th>问题标签</th><th>TP / FP / FN</th><th>Precision</th><th>Recall</th><th>F1</th><th>未知排除</th></tr></thead><tbody>${Object.entries(V.per_tag).map(([t,x])=>`<tr><td>${T[t]}<br><small class="muted">${t}</small></td><td>${x.tp} / ${x.fp} / ${x.fn}</td><td>${pct(x.precision)}</td><td>${pct(x.recall)}</td><td>${num(x.f1)}</td><td>${x.excluded}</td></tr>`).join('')}</tbody></table></div><p class="sub">Macro F1：${num(V.macro_f1)} · 已定义标签数：${V.macro_defined_labels} · 未知标签对 ${V.micro.excluded} 个 · 全部样本已被开发者查看。</p><h3 style="margin-top:24px">分歧复核清单</h3>${V.disagreements.map(x=>`<div class="finding"><b>${esc(x.id)} · ${esc(T[x.tag])}</b> <span class="pill warn">${x.kind==='fp'?'预测有 / 参考无':'预测无 / 参考有'}</span><p>${esc(x.basis)}</p></div>`).join('')||'<p>当前标签未发现分歧，不代表具备未见数据上的泛化能力。</p>'}<h3 style="margin-top:24px">人工参考争议</h3>${D.validation?list(D.validation.excluded.map(x=>x.id+'：'+x.basis)):''}`:'<p>本次未提供多标签复核集。</p>';
